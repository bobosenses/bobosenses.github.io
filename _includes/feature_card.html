<article class="feature-card">
  <p class="feature-kicker">
    {% if include.post.categories.size > 0 %}
      {{ include.post.categories | join: " · " | escape }}
    {% else %}
      笔记
    {% endif %}
  </p>
  <h3><a href="{{ include.post.url | relative_url }}">{{ include.post.title | escape }}</a></h3>
  <p class="feature-summary">{% include summary.html post=include.post limit=150 %}</p>
  <p class="feature-date"><time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%Y.%m.%d" }}</time></p>
</article>
