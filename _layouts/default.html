<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}" data-default-theme="{{ site.default_theme | default: 'system' }}">
<head>
  {% include head.html %}
</head>
<body class="layout-{{ page.layout | default: 'default' }}">
  <a class="skip" href="#content">跳到正文</a>
  <div class="top-rule" aria-hidden="true"><span data-scroll-progress></span></div>
  {% include header.html %}
  <main id="content" class="wrap">
    {{ content }}
  </main>
  {% include footer.html %}
  <button type="button" class="to-top" data-to-top hidden>回到顶部</button>
  <script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
