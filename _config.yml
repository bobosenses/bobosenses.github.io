# 个人站点配置。改完推送到 GitHub 后，Actions 会重新构建。
#
# 经常要改的地方：
# - title / tagline / description：站点标题、首页导语、SEO 描述
# - profile：名字、GitHub、首页短介绍；email / role / location 留空则不显示
# - social.links：要和 profile.github 一起改，供 SEO 使用
# - featured_posts：首页「精选」文章，填 _posts 文件名里的 slug（日期后面的那一段）
# - default_theme：light、dark 或 system（跟随系统）

lang: zh-CN
timezone: Asia/Shanghai
title: "Bobo's Blog"
tagline: "记录想法，分享生活"
description: "个人博客，记录技术探索、生活感悟和一切值得分享的内容。"

url: "https://bobosenses.github.io"
baseurl: ""

author: Bobo

profile:
  name: Bobo
  github: bobosenses
  # 与「关于」页第一句保持一致即可，也可以改成你想放在首页的短句。
  intro: "你好！我是 Bobo，欢迎来到我的个人博客。"
  # 下面三项选填。留空不会出现在页面上，不要填没有的信息。
  email: ""
  role: ""
  location: ""

social:
  name: Bobo
  links:
    - https://github.com/bobosenses

featured_posts:
  - vllm-resume-matching-system
  - neo4j-introduction

default_theme: system

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false

sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /posts/:title/
      toc: true
  - scope:
      path: ""
      type: tabs
    values:
      layout: page

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - tools
  - vendor
  - node_modules
  - docs
  - "*.gem"
  - "*.gemspec"
